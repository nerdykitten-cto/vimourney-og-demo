<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buffer Overflow: a Vim action RPG</title>
    <meta name="description" content="A top-down action RPG where every move is a real Vim command. Walk the map with h j k l, hook with f, and beat bosses with your keyboard." />
    <meta name="theme-color" content="#5af78e" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Buffer Overflow" />
    <meta property="og:title" content="Buffer Overflow: a Vim action RPG" />
    <meta property="og:description" content="Every move is a real Vim command. Two areas, nine enemies, two bosses and an arcade high score. Plays in the browser with a keyboard." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e13; overflow: hidden; color: #cbd5e1; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      [hidden] { display: none !important; }
      #loading, #notice { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }
      #loading { color: #64748b; }
      #notice h1 { margin: 0; color: #5af78e; font-size: 28px; }
      #notice p { margin: 0; max-width: 34em; }
      #notice img { width: 100%; max-width: 480px; border-radius: 8px; justify-self: center; }
      #notice button { justify-self: center; padding: 8px 16px; font: inherit; color: #cbd5e1; background: #141c25; border: 1px solid #64748b; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" hidden>Loading...</div>
    <section id="notice" hidden>
      <h1>Buffer Overflow</h1>
      <img src="./og.png" alt="The Buffer Overflow title above a map of the first area" />
      <p>This game is played with a physical keyboard, because every move is a real Vim command. Open this link on a computer to play.</p>
      <button id="anyway" type="button">I have a keyboard</button>
    </section>
    <noscript><p>Buffer Overflow needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
