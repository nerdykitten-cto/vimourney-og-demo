<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vimourney: a Vim action RPG</title>
    <meta name="description" content="A top-down action RPG where every move is a real Vim command. Walk the map with h j k l, hook with f, and beat bosses with your keyboard." />
    <meta name="theme-color" content="#5af78e" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vimourney" />
    <meta property="og:title" content="Vimourney: a Vim action RPG" />
    <meta property="og:description" content="Every move is a real Vim command. Two areas, seven enemies, two bosses and an arcade high score. Plays in the browser, on a computer or a phone." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e13; overflow: hidden; color: #cbd5e1; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
      #app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); background: #0a0e13; }
      #game { min-width: 0; min-height: 0; }
      canvas { display: block; }
      [hidden] { display: none !important; }
      #loading, #notice { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }
      #loading { color: #64748b; }
      #notice h1 { margin: 0; color: #5af78e; font-size: 28px; }
      #notice p { margin: 0; max-width: 34em; }
      #notice img { width: 100%; max-width: 480px; border-radius: 8px; justify-self: center; }
      #notice button { justify-self: center; padding: 8px 16px; font: inherit; color: #cbd5e1; background: #141c25; border: 1px solid #64748b; border-radius: 6px; }
      #notice #play { padding: 12px 40px; color: #0a0e13; background: #5af78e; border-color: #5af78e; font-weight: 700; }
      .wing, .board { display: none; }
      .row { flex: 1; display: flex; gap: 3px; min-height: 0; }
      .row > * { flex: 1 1 0; min-width: 0; }
      .key { position: relative; padding: 0; color: #64748b; background: #141c25; border: 1px solid #1f2a36; border-radius: 6px; font: 700 15px ui-monospace, Menlo, Consolas, monospace; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      .key.move { color: #57c7ff; border-color: #2b7fb0; }
      .key.ctl { color: #ffb86c; border-color: #b36f2c; font-size: 10px; }
      .key.shift { font-size: 20px; }
      .key.on { color: #0a0e13; background: #ffb86c; }
      .key.down { color: #0a0e13; background: #57c7ff; }
      .key small { position: absolute; top: 2px; right: 3px; font-size: 10px; }
      #tip { display: none; position: fixed; top: 16px; left: 0; right: 0; text-align: center; color: #64748b; font-size: 13px; pointer-events: none; }
      /* Sideways, each half sits in a bottom corner under a thumb, with the game above and between them.
         One key is --u wide and tall on every screen, and --u sizes both halves, so keys are always square. */
      @media (orientation: landscape) {
        :root { --u: min(100vw / 17, 100dvh / 13, 48px); }
        body.touch #app { grid-template-rows: minmax(0, 1fr) calc(4 * var(--u) + 6px); }
        body.touch .board { display: block; position: fixed; bottom: 2px; height: calc(4 * var(--u)); }
        #board-left { left: max(3px, env(safe-area-inset-left)); width: calc(8 * var(--u)); }
        #board-right { right: max(3px, env(safe-area-inset-right)); width: calc(8.25 * var(--u)); }
        .board .key { position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--u) - 3px); height: calc(var(--u) - 3px); font-size: calc(var(--u) * 0.44); }
        .board .key.ctl { font-size: calc(var(--u) * 0.3); }
        .board .key.shift { font-size: calc(var(--u) * 0.55); }
        .board .key small { top: 0; right: 2px; font-size: calc(var(--u) * 0.3); }
      }
      /* On squarer screens the game is wide enough to reach Esc, so it stops above Esc's row too. */
      @media (orientation: landscape) and (max-aspect-ratio: 8/5) {
        body.touch #app { grid-template-rows: minmax(0, 1fr) calc(5.25 * var(--u) + 6px); }
      }
      /* Upright, the two halves meet below the game and become one ordinary keyboard. */
      @media (orientation: portrait) {
        body.touch .wing { display: flex; flex-direction: column; min-width: 0; box-sizing: border-box; gap: 3px; padding: 4px; }
        body.touch #app { grid-template-columns: 50vw 50vw; grid-template-rows: minmax(0, 1fr) 38dvh; grid-template-areas: "game game" "left right"; }
        body.touch #game { grid-area: game; }
        body.touch #left { grid-area: left; padding-right: 1.5px; }
        body.touch #right { grid-area: right; padding-left: 1.5px; }
        body.touch #tip { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left" class="wing"></div>
      <div id="game"></div>
      <div id="right" class="wing"></div>
    </div>
    <div id="board-left" class="board"></div>
    <div id="board-right" class="board"></div>
    <div id="tip">Turn your phone sideways for a bigger game</div>
    <div id="loading" hidden>Loading...</div>
    <section id="notice" hidden>
      <h1>Vimourney</h1>
      <img src="./og.png" alt="The Vimourney title above a map of the first area" />
      <p>Every move is a real Vim command, so you play on a full on-screen QWERTY keyboard. Hold your phone either way: sideways gives a bigger game. A computer gives you the best version.</p>
      <button id="play" type="button">Play</button>
      <button id="anyway" type="button">I have a real keyboard</button>
    </section>
    <noscript><p>Vimourney needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
