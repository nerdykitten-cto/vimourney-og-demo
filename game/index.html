<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vimourney: a Vim action RPG</title>
    <meta name="description" content="A top-down action RPG where every move is a real Vim command. Walk the map with h j k l, hook with f, and beat bosses with your keyboard." />
    <meta name="theme-color" content="#5af78e" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vimourney" />
    <meta property="og:title" content="Vimourney: a Vim action RPG" />
    <meta property="og:description" content="Every move is a real Vim command. Two areas, seven enemies, two bosses and an arcade high score. Plays in the browser, on a computer or a phone." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e13; overflow: hidden; color: #cbd5e1; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
      #app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); background: #0a0e13; }
      #game { min-width: 0; min-height: 0; }
      canvas { display: block; }
      [hidden] { display: none !important; }
      #loading, #notice { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }
      #loading { color: #64748b; }
      #notice h1 { margin: 0; color: #5af78e; font-size: 28px; }
      #notice p { margin: 0; max-width: 34em; }
      #notice img { width: 100%; max-width: 480px; border-radius: 8px; justify-self: center; }
      #notice { overflow-y: auto; }
      @media (max-height: 560px) { #notice img { display: none; } #notice p { font-size: 14px; } }
      #notice button { justify-self: center; padding: 8px 16px; font: inherit; color: #cbd5e1; background: #141c25; border: 1px solid #64748b; border-radius: 6px; }
      #notice #play { padding: 12px 40px; color: #0a0e13; background: #5af78e; border-color: #5af78e; font-weight: 700; }
      .board { display: none; }
      /* The two boards overlap, so only the keys themselves may take a touch. */
      body.touch .board { display: block; position: fixed; bottom: var(--edge); height: calc(4 * var(--u)); pointer-events: none; }
      .key { position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--u) - var(--gap)); height: calc(var(--u) - var(--gap)); padding: 0; color: #94a3b8; background: var(--cap); border: 1px solid #2b3b50; border-radius: calc(var(--u) * 0.18); font: 700 calc(var(--u) * 0.46) ui-monospace, Menlo, Consolas, monospace; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      .key.move { color: #57c7ff; border-color: #2b7fb0; }
      .key.ctl { color: #ffb86c; border-color: #b36f2c; font-size: calc(var(--u) * 0.3); }
      .key.shift { font-size: calc(var(--u) * 0.55); }
      .key.on { color: #0a0e13; background: #ffb86c; }
      .key.down { color: #0a0e13; background: #57c7ff; }
      .key small { position: absolute; top: 0; right: 2px; font-size: calc(var(--u) * 0.3); }
      #tip { display: none; text-align: center; color: #64748b; font-size: 13px; pointer-events: none; }
      /* One key is --u wide and tall on every screen, and --u places every key, so keys are always square. */
      /* Sideways the game takes the full height and the keys sit over its lower corners, see-through,
         because a phone is too short for thumb-sized keys and a readable game to share the height. */
      @media (orientation: landscape) {
        :root { --u: min(100vw / 15, 100dvh / 8.5, 48px); --gap: 3px; --edge: 4px; --cap: rgba(20, 28, 37, 0.62); }
        .key.spare { display: none; }
        #board-left { left: max(3px, env(safe-area-inset-left)); width: calc(8 * var(--u)); }
        #board-right { right: calc(max(3px, env(safe-area-inset-right)) - var(--gap)); width: calc(6.5 * var(--u)); }
      }
      /* On squarer screens there is height to spare, so the game stops above the keys. */
      @media (orientation: landscape) and (max-aspect-ratio: 8/5) {
        body.touch #app { grid-template-rows: minmax(0, 1fr) calc(4 * var(--u) + 8px); }
        .key.spare { display: block; }
      }
      /* Upright it is one phone-width keyboard at the thumbs, with the game centered in the space above. */
      @media (orientation: portrait) {
        :root { --u: min((100vw - 8px) / 10.5, 48px); --gap: 2px; --edge: max(20px, env(safe-area-inset-bottom)); --board: calc(5 * var(--u) + var(--edge) + 8px); --cap: #141c25; }
        body.touch #app { grid-template-rows: minmax(0, 1fr) 56.25vw minmax(0, 1fr) var(--board); }
        body.touch #game { grid-row: 2; }
        body.touch #tip { display: block; grid-row: 1; align-self: end; padding-bottom: 12px; }
        body.touch .board { left: calc((100vw - 10.5 * var(--u) + var(--gap)) / 2); width: calc(10.5 * var(--u)); height: calc(5 * var(--u)); }
        .key { left: calc(var(--ux) * var(--u)); top: calc(var(--uy) * var(--u)); }
        .key.sideways-only { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="tip">Turn your phone sideways for a bigger game</div>
      <div id="game"></div>
    </div>
    <div id="board-left" class="board"></div>
    <div id="board-right" class="board"></div>
    <div id="loading" hidden>Loading...</div>
    <section id="notice" hidden>
      <h1>Vimourney</h1>
      <img src="./og.png" alt="The Vimourney title above a map of the first area" />
      <p>Every move is a real Vim command, so you play on a full on-screen QWERTY keyboard. Hold your phone either way: sideways gives a bigger game. A computer gives you the best version.</p>
      <button id="play" type="button">Play</button>
      <button id="anyway" type="button">I have a real keyboard</button>
    </section>
    <noscript><p>Vimourney needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
